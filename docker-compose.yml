version: "3.9"

services:
  homefind-ai:
    build: .
    image: homefind-ai:latest
    container_name: homefind-ai
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      # Persist generated artefacts outside the container
      - ./vector_db:/app/vector_db
      - ./user_data:/app/user_data
      - ./dataset:/app/dataset:ro   # dataset is read-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/properties/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
