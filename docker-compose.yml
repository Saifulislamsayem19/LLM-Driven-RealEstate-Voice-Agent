services:
  homefind-ai:
    build: .
    image: homefind-ai:latest
    container_name: homefind-ai
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      # Persist generated artefacts outside the container
      - ./vector_db:/app/vector_db
      - ./user_data:/app/user_data
      - ./dataset:/app/dataset:ro   # dataset is read-only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s   # first start may build the vector index
